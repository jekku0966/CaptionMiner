<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title description">
  <title id="title">CaptionMiner 0.2.0-alpha.1 Miner-family desktop GUI preview</title>
  <desc id="description">The dark navy and gold CaptionMiner window with Miner Tools branding, a media queue, model selection, output controls, progress bar, and processing log.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0D1117" flood-opacity="0.58"/>
    </filter>
    <style>
      .ui { font-family: "Segoe UI", Arial, sans-serif; fill: #EEF2F6; }
      .title { font-size: 18px; font-weight: 600; }
      .heading { font-size: 34px; font-weight: 600; }
      .body { font-size: 16px; }
      .label { font-size: 16px; font-weight: 600; }
      .muted { fill: #A9B3BE; }
      .small { font-size: 14px; }
      .control { fill: #111821; stroke: #303A46; stroke-width: 1.5; }
      .button { fill: #1B2531; stroke: #303A46; stroke-width: 1.5; }
      .buttonText { font-size: 15px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1200" height="1160" fill="#0D1117"/>
  <rect x="20" y="20" width="1160" height="1120" rx="12" fill="#0D1117" stroke="#303A46" filter="url(#shadow)"/>

  <path d="M32 20h1136a12 12 0 0 1 12 12v42H20V32a12 12 0 0 1 12-12z" fill="#111821"/>
  <line x1="20" y1="74" x2="1180" y2="74" stroke="#E8A63A" stroke-width="2"/>
  <text class="ui title" x="42" y="54">CaptionMiner 0.2.0-alpha.1</text>
  <g class="ui" stroke="#A9B3BE" stroke-width="1.6" fill="none">
    <line x1="1072" y1="48" x2="1087" y2="48"/>
    <rect x="1110" y="39" width="14" height="14"/>
    <line x1="1148" y1="40" x2="1162" y2="54"/>
    <line x1="1162" y1="40" x2="1148" y2="54"/>
  </g>

  <rect x="60" y="92" width="48" height="42" rx="7" fill="#E8A63A"/>
  <text x="84" y="119" text-anchor="middle" class="ui title" fill="#0D1117">CC</text>
  <text class="ui heading" x="124" y="124">CaptionMiner</text>
  <rect x="390" y="100" width="118" height="28" rx="12" fill="#111821" stroke="#303A46"/>
  <text class="ui small" x="449" y="119" text-anchor="middle" fill="#F2B84B">MINER TOOLS</text>
  <rect class="button" x="1018" y="94" width="122" height="40" rx="5"/>
  <text class="ui buttonText" x="1079" y="114">Settings</text>
  <text class="ui body muted" x="60" y="160">Drop exported clips below. CaptionMiner transcribes them locally and creates plain SRT subtitle files;</text>
  <text class="ui body muted" x="60" y="184">styling remains in your video editor.</text>

  <rect class="control" x="60" y="208" width="1080" height="154" rx="5"/>
  <rect x="61" y="209" width="1078" height="46" rx="4" fill="#1B2531"/>
  <rect x="61" y="209" width="4" height="46" fill="#E8A63A"/>
  <text class="ui body" x="80" y="238">D:\Clips\H001_controller_incident.mp4</text>
  <line x1="60" y1="255" x2="1140" y2="255" stroke="#303A46"/>
  <text class="ui body" x="80" y="286">D:\Clips\H002_perfectly_sensible_idea.mp4</text>
  <line x1="60" y1="303" x2="1140" y2="303" stroke="#303A46"/>
  <text class="ui body muted" x="80" y="334">Drop local video or audio files here</text>

  <g class="ui">
    <rect class="button" x="60" y="380" width="114" height="40" rx="5"/>
    <text class="buttonText" x="117" y="400">Add files</text>
    <rect class="button" x="186" y="380" width="160" height="40" rx="5"/>
    <text class="buttonText" x="266" y="400">Remove selected</text>
    <rect class="button" x="358" y="380" width="86" height="40" rx="5"/>
    <text class="buttonText" x="401" y="400">Clear</text>
  </g>

  <rect x="60" y="446" width="1080" height="382" rx="7" fill="#171E27" stroke="#303A46" stroke-width="1.5"/>
  <rect x="80" y="434" width="116" height="24" fill="#171E27"/>
  <text class="ui label" x="88" y="452">Transcription</text>

  <text class="ui label" x="90" y="500">Accuracy profile / model</text>
  <rect class="control" x="360" y="472" width="740" height="42" rx="5"/>
  <text class="ui body" x="378" y="499">Balanced — medium</text>
  <path d="M1070 488l7 8 7-8" fill="none" stroke="#A9B3BE" stroke-width="2"/>

  <text class="ui label" x="90" y="558">Spoken language</text>
  <rect class="control" x="360" y="530" width="740" height="42" rx="5"/>
  <text class="ui body" x="378" y="557">Auto-detect</text>
  <path d="M1070 546l7 8 7-8" fill="none" stroke="#A9B3BE" stroke-width="2"/>

  <text class="ui label" x="90" y="616">Processing device</text>
  <rect class="control" x="360" y="588" width="740" height="42" rx="5"/>
  <text class="ui body" x="378" y="615">Automatic</text>
  <path d="M1070 604l7 8 7-8" fill="none" stroke="#A9B3BE" stroke-width="2"/>

  <text class="ui label" x="90" y="674">Custom vocabulary</text>
  <rect class="control" x="360" y="646" width="740" height="42" rx="5"/>
  <text class="ui body muted" x="378" y="673">Optional names/terms: Snarkos, Veadotube, TwitchDownloader</text>

  <text class="ui label" x="90" y="732">Output folder</text>
  <rect class="control" x="360" y="704" width="620" height="42" rx="5"/>
  <text class="ui body muted" x="378" y="731">Empty = create each SRT beside its source clip</text>
  <rect class="button" x="992" y="704" width="108" height="42" rx="5"/>
  <text class="ui buttonText" x="1046" y="725">Browse</text>

  <rect class="control" x="360" y="772" width="20" height="20" rx="3"/>
  <text class="ui body" x="394" y="789">Overwrite an existing same-named SRT</text>

  <rect x="60" y="852" width="130" height="44" rx="5" fill="#E8A63A"/>
  <text class="buttonText" x="125" y="874" fill="#0D1117">Transcribe</text>
  <rect x="202" y="852" width="96" height="44" rx="5" fill="#171E27" stroke="#303A46"/>
  <text class="ui buttonText muted" x="250" y="874">Cancel</text>

  <rect x="60" y="920" width="1080" height="20" rx="8" fill="#1B2531" stroke="#303A46"/>
  <rect x="60" y="920" width="420" height="20" rx="8" fill="#E8A63A"/>
  <text class="ui body" x="60" y="974" fill="#F2B84B">Transcribing H001_controller_incident.mp4…</text>

  <rect class="control" x="60" y="998" width="1080" height="108" rx="5"/>
  <text class="ui small muted" x="78" y="1026">Processing log</text>
</svg>
