name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "captionminer/**"
      - "tests/**"
      - "tools/**"
      - "runtime/**"
      - "CaptionMiner.spec"
      - "build_windows.ps1"
      - "BUILD_WINDOWS.md"
      - "pyproject.toml"
      - ".github/workflows/build-windows-exe.yml"
  push:
    branches: [main]
    paths:
      - "captionminer/**"
      - "tests/**"
      - "tools/**"
      - "runtime/**"
      - "CaptionMiner.spec"
      - "build_windows.ps1"
      - "BUILD_WINDOWS.md"
      - "pyproject.toml"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Read project version
        id: project
        shell: powershell
        run: |
          $version = python .\tools\project_version.py
          if (-not $version) { throw "Could not read project version from pyproject.toml." }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Packaging CaptionMiner v$version for windows-x64"

      - name: Build portable application
        shell: powershell
        run: |
          if (Test-Path ".\runtime\cuda") {
            Remove-Item ".\runtime\cuda" -Recurse -Force
          }
          .\build_windows.ps1
          if (-not (Test-Path ".\runtime\cuda" -PathType Container)) {
            throw "The builder did not recreate runtime\cuda."
          }

      - name: Verify frozen dependency imports
        shell: powershell
        run: |
          $output = & .\dist\CaptionMiner\CaptionMiner.exe doctor 2>&1
          $doctorExit = $LASTEXITCODE
          $text = $output -join "`n"
          $output | Out-Host

          if ($doctorExit -ne 0) {
            throw "Frozen doctor exited with code $doctorExit."
          }
          foreach ($expected in @("captionminer:", "faster-whisper:", "CTranslate2:", "PyAV:", "PySide6:")) {
            if ($text -notmatch [regex]::Escape($expected)) {
              throw "Frozen doctor output is missing: $expected"
            }
          }

      - name: Verify packaged documentation
        shell: powershell
        run: |
          foreach ($required in @("README.md", "BUILD_WINDOWS.md", "ATTRIBUTIONS.md", "SECURITY.md", "LICENSE")) {
            if (-not (Test-Path ".\dist\CaptionMiner\$required" -PathType Leaf)) {
              throw "Packaged application is missing $required."
            }
          }

      - name: Smoke-test frozen PySide6 GUI
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = Resolve-Path ".\dist\CaptionMiner\CaptionMiner.exe"
          $process = $null

          try {
            $process = Start-Process -FilePath $exe -WorkingDirectory ".\dist\CaptionMiner" -PassThru
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "CaptionMiner.exe exited during the GUI smoke test. Exit code: $($process.ExitCode)"
            }
            Write-Host "Frozen PySide6 GUI remained alive for the smoke-test interval."
          }
          finally {
            if ($process -and -not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
            }
          }

      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: CaptionMiner-v${{ steps.project.outputs.version }}-windows-x64
          path: dist/CaptionMiner-v${{ steps.project.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
